spring.application.name=vehicle-health-service
server.port=8082

# PostgreSQL - dedicated database for Vehicle Health Service
spring.datasource.url=${HEALTH_DB_URL:jdbc:postgresql://localhost:5432/health_db}
spring.datasource.username=${HEALTH_DB_USERNAME:postgres}
spring.datasource.password=${HEALTH_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Kafka producer uses JSON strings
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3

# Kafka consumer reads JSON strings
spring.kafka.consumer.group-id=vehicle-health-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record

# Shared JWT secret across ALL microservices
app.jwt.secret=${JWT_SECRET:VGhpc0lzQVN1cGVyU2VjcmV0S2V5Rm9ySldUVG9rZW5HZW5lcmF0aW9uMTIzNDU2Nzg5MA==}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Logging
logging.level.com.mercedes.telemetry=INFO
logging.level.org.springframework.kafka=WARN

# SMTP4DEV EMAIL CONFIGURATION
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.ssl.enable=false

# Email sender identity
app.mail.from=noreply@mercedes.local
app.mail.from-name=Mercedes-Benz Vehicle Health Monitoring
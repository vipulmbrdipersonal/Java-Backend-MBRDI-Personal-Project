spring.application.name=vehicle-service
server.port=${SERVER_PORT:8086}

# =========================================
# DATABASE CONFIGURATION
# =========================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vehicle_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =========================================
# KAFKA CONFIGURATION
# =========================================

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.admin.auto-create=true
spring.kafka.admin.fail-fast=true

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer
spring.kafka.consumer.group-id=vehicle-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Deserialize incoming messages as JSON trees.
# Ignore producer Java class headers because producer and consumer
# microservices have different Java package structures.
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.fasterxml.jackson.databind.JsonNode
spring.kafka.consumer.properties.spring.json.use.type.headers=false

spring.kafka.listener.missing-topics-fatal=false

# =========================================
# SECURITY CONFIGURATION
# =========================================

# Shared JWT secret across all microservices
app.security.jwt-secret=${JWT_SECRET:VGhpc0lzQVN1cGVyU2VjcmV0S2V5Rm9ySldUVG9rZW5HZW5lcmF0aW9uMTIzNDU2Nzg5MA==}

# =========================================
# KAFKA TOPICS
# =========================================

app.kafka.topic.purchase-completed=purchase.completed
app.kafka.topic.vehicle-created=vehicle.created
app.kafka.topic.vehicle-ownership-assigned=vehicle.ownership.assigned
app.kafka.topic.auth-token-revoked=auth.token.revoked

app.kafka.partitions=1
app.kafka.replicas=1

# =========================================
# ACTUATOR CONFIGURATION
# =========================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
spring.application.name=auth-service
server.port=8090

# ===============================
# POSTGRESQL DATABASE
# ===============================

spring.datasource.url=${AUTH_DB_URL:jdbc:postgresql://localhost:5432/auth_db}
spring.datasource.username=${AUTH_DB_USERNAME:postgres}
spring.datasource.password=${AUTH_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Automatically create/update database tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# KAFKA CONFIGURATION
# ===============================

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.producer.acks=all
spring.kafka.producer.retries=5
spring.kafka.producer.properties.enable.idempotence=true

# Kafka admin automatically creates declared topics
spring.kafka.admin.auto-create=true
spring.kafka.admin.fail-fast=true

# ===============================
# JWT CONFIGURATION
# ===============================

# Shared JWT secret across ALL microservices
app.jwt.secret=${JWT_SECRET:VGhpc0lzQVN1cGVyU2VjcmV0S2V5Rm9ySldUVG9rZW5HZW5lcmF0aW9uMTIzNDU2Nzg5MA==}

app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===============================
# JPA
# ===============================

spring.jpa.open-in-view=false

# ===============================
# ACTUATOR
# ===============================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ===============================
# LOGGING
# ===============================

logging.level.root=INFO
logging.level.com.mercedes.telemetry=DEBUG
logging.level.org.springframework.kafka=WARN
logging.level.org.hibernate.SQL=WARN

# =========================================
# PROFILE PHOTO UPLOAD CONFIGURATION
# =========================================

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ===============================
# FRONTEND CORS
# ===============================

app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}
spring.application.name=purchase-service
server.port=8087

# PostgreSQL - create purchase_db before starting the service
spring.datasource.url=${PURCHASE_DB_URL:jdbc:postgresql://localhost:5432/purchase_db}
spring.datasource.username=${PURCHASE_DB_USERNAME:postgres}
spring.datasource.password=${PURCHASE_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate creates and updates tables automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.consumer.group-id=purchase-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

# Catalog Service REST API
services.catalog.base-url=${CATALOG_SERVICE_URL:http://localhost:8085}

# Shared JWT secret across ALL microservices
security.jwt.secret=${JWT_SECRET:VGhpc0lzQVN1cGVyU2VjcmV0S2V5Rm9ySldUVG9rZW5HZW5lcmF0aW9uMTIzNDU2Nzg5MA==}

# Do not expose secrets in logs
logging.level.org.springframework.security=WARN
logging.level.com.mercedes.telemetry=INFO
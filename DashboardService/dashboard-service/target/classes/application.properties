spring.application.name=dashboard-service
server.port=8088

# Dedicated PostgreSQL database
spring.datasource.url=${DASHBOARD_DB_URL:jdbc:postgresql://localhost:5432/dashboard_db}
spring.datasource.username=${DASHBOARD_DB_USERNAME:postgres}
spring.datasource.password=${DASHBOARD_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Kafka producer defaults (string JSON)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all

# Kafka consumers read JSON strings
spring.kafka.consumer.group-id=dashboard-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record

# JWT: shared across ALL microservices
app.jwt.secret=${JWT_SECRET:VGhpc0lzQVN1cGVyU2VjcmV0S2V5Rm9ySldUVG9rZW5HZW5lcmF0aW9uMTIzNDU2Nzg5MA==}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Logging
logging.level.com.mercedes.dashboard=INFO
logging.level.org.springframework.kafka=WARN

# CORS
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}